# Template: render ONLY ${MK_PUBLIC_DOMAIN}; preserve Nginx variables.
limit_req_zone $binary_remote_addr zone=mkquant_login:1m rate=10r/m;
server {
    listen 80;
    listen [::]:80;
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name ${MK_PUBLIC_DOMAIN};
    root /www/wwwroot/mk-quant/frontend/dist;
    index index.html;
    include /www/server/panel/vhost/nginx/extension/${MK_PUBLIC_DOMAIN}/*.conf;
    #REWRITE-START
    include /www/server/panel/vhost/rewrite/html_${MK_PUBLIC_DOMAIN}.conf;
    #REWRITE-END
    client_max_body_size 30m;
    #CERT-APPLY-CHECK--START
    include /www/server/panel/vhost/nginx/well-known/${MK_PUBLIC_DOMAIN}.conf;
    #CERT-APPLY-CHECK--END
    #SSL-START SSL相关配置
    #error_page 404/404.html;
    ssl_certificate /www/server/panel/vhost/cert/${MK_PUBLIC_DOMAIN}/fullchain.pem;
    ssl_certificate_key /www/server/panel/vhost/cert/${MK_PUBLIC_DOMAIN}/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_cache shared:MKQuantTLS:1m;
    ssl_session_timeout 10m;
    #SSL-END
    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy same-origin always;
    location ^~ /.well-known/acme-challenge/ { allow all; try_files $uri =404; }
    location ~ /\. { deny all; }
    location = /api/login {
        if ($scheme = http) { return 301 https://$host$request_uri; }
        limit_req zone=mkquant_login burst=5 nodelay;
        limit_req_status 429;
        proxy_pass http://127.0.0.1:8765;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ {
        if ($scheme = http) { return 301 https://$host$request_uri; }
        proxy_pass http://127.0.0.1:8765;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_read_timeout 300s;
        proxy_buffering off;
    }
    location = /healthz { proxy_pass http://127.0.0.1:8765; access_log off; }
    location /assets/ {
        if ($scheme = http) { return 301 https://$host$request_uri; }
        try_files $uri =404;
        add_header Cache-Control "public, max-age=31536000, immutable";
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }
    location / {
        if ($scheme = http) { return 301 https://$host$request_uri; }
        try_files $uri $uri/ /index.html;
        add_header Cache-Control no-cache;
        add_header X-Content-Type-Options nosniff always;
        add_header X-Frame-Options DENY always;
        add_header Referrer-Policy same-origin always;
    }
    access_log /www/wwwlogs/mk-quant.access.log;
    error_log /www/wwwlogs/mk-quant.error.log;
}
